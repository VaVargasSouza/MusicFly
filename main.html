
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7b2cbf">
    <meta name="description" content="MusicFly - Ouça suas músicas favoritas">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
    <title>MusicFly | Sua música</title>
</head>

<body class="main-body">
    <header class="main-header">
        <h1>🦋 MusicFly</h1>

        <div class="usuario-area">
            <span id="emailUsuario"></span>
            <button id="btnSair" type="button">Sair</button>
        </div>
    </header>

    <main class="main-container">
        <section class="boas-vindas">
            <h2>Sua música, seu mundo</h2>
            <p>Ouça suas favoritas e crie suas próprias playlists.</p>
        </section>

        <section class="biblioteca">
            <h3>Suas playlists</h3>

            <form id="formPlaylist" class="form-playlist">
                <div class="campo-playlist">
                    <label for="nomePlaylist">Nome da playlist</label>
                    <input id="nomePlaylist" type="text"
                        placeholder="Ex.: Minhas favoritas" required>
                </div>

                <div class="campo-playlist">
                    <label for="capaPlaylist">URL da capa (opcional)</label>
                    <input id="capaPlaylist" type="url"
                        placeholder="https://site.com/capa.jpg">
                </div>

                <button id="btnCriarPlaylist" type="submit">
                    Criar playlist
                </button>
            </form>

            <p id="mensagemPlaylist" role="status" aria-live="polite"></p>
            <div id="listaPlaylists" class="lista-playlists"></div>
            <div id="detalhePlaylist"></div>
        </section>

        <section class="biblioteca">
            <h3>Músicas disponíveis</h3>
            <p id="mensagem" role="status" aria-live="polite">
                Carregando músicas...
            </p>
            <div id="listaMusicas" class="lista-musicas"></div>
        </section>
    </main>

    <script type="module" src="./js/main.js"></script>
    <script src="./js/pwa.js"></script>
</body>
</html>
