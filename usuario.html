<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicFly | Acesso</title>

    <link rel="stylesheet" href="./css/usuario.css">
</head>

<body class="usuario-body">

    <main class="pagina-acesso">

        <section class="card-acesso">

            <div class="logo-area">
                <div class="logo-borboleta" aria-hidden="true">
                    🦋
                </div>

                <h1>MusicFly</h1>

                <p>
                    Sua música. Seu momento.
                </p>
            </div>


            <div class="formulario-acesso">

                <h2>Bem-vindo!</h2>

                <p class="descricao">
                    Entre na sua conta ou crie uma nova.
                </p>


                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                    >

                </div>


                <div class="botoes-acesso">

                    <button
                        id="login"
                        type="button"
                        class="botao-principal"
                    >
                        Entrar
                    </button>

                    <button
                        id="cadastrar"
                        type="button"
                        class="botao-secundario"
                    >
                        Criar conta
                    </button>

                </div>


                <button
                    id="logout"
                    type="button"
                    class="botao-logout"
                >
                    Sair da conta
                </button>

            </div>

        </section>

    </main>

    <script type="module"  src="./js/usuario.js" ></script>

</body>

</html>
