<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#7b2cbf"
    >

    <meta
        name="description"
        content="MusicFly - Seu aplicativo de músicas"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="icon"
        type="image/png"
        href="./icons/icon-192.png"
    >

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/usuario.css"
    >

    <title>MusicFly | Entrar</title>

</head>


<body class="usuario-body">

    <main class="usuario-container">

        <section class="usuario-card">

            <h1>🦋 MusicFly</h1>

            <p>
                Entre ou crie sua conta
            </p>


            <!-- NOME -->

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                >

            </div>


            <!-- EMAIL -->

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                >

            </div>


            <!-- SENHA -->

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                >

            </div>


            <!-- BOTÕES -->

            <div class="botoes">

                <button
                    id="login"
                    type="button"
                >
                    Entrar
                </button>


                <button
                    id="cadastrar"
                    type="button"
                >
                    Criar conta
                </button>

            </div>


            <button
                id="logout"
                type="button"
            >
                Sair da conta
            </button>

        </section>

    </main>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="./js/usuario.js"
    ></script>

    <script
        src="./js/pwa.js"
    ></script>

</body>

</html>
