
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFly | Administração</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body class="admin-body">

<header class="admin-header">
    <h1>🦋 MusicFly</h1>

    <div>
        <span id="emailAdmin"></span>

        <button id="btnMusica" type="button">
            Ir para MusicFly
        </button>

        <button id="btnSair" type="button">
            Sair
        </button>
    </div>
</header>

    <main class="admin-container">
        <h2>Painel administrativo</h2>
        <p>Cadastre e gerencie as músicas da plataforma.</p>

        <section class="admin-card">
            <h3 id="tituloFormulario">Cadastrar música</h3>

            <form id="formMusica">
                <label for="titulo">Título da música</label>
                <input id="titulo" type="text" required>

                <label for="artista">Artista</label>
                <input id="artista" type="text" required>

                <label for="audioUrl">URL do áudio</label>
                <input
                    id="audioUrl"
                    type="url"
                    placeholder="https://exemplo.com/musica.mp3"
                    required
                >

                <div class="admin-buttons">
                    <button id="btnSalvar" type="submit">
                        Cadastrar música
                    </button>

                    <button id="btnCancelar" type="button" hidden>
                        Cancelar edição
                    </button>
                </div>
            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>
        </section>

        <section class="admin-card">
            <h3>Músicas cadastradas</h3>
            <div id="listaMusicas">
                <p>Carregando músicas...</p>
            </div>
        </section>
    </main>

    <script type="module" src="./js/admin.js"></script>
</body>
</html>
