
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7b2cbf">
    <meta name="description" content="MusicFly - Administração de músicas">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/admin.css">
    <title>MusicFly | Administração</title>
</head>

<body class="admin-body">
    <header class="admin-header">
        <h1>🦋 MusicFly</h1>

        <div class="admin-header-actions">
            <span id="emailAdmin"></span>
            <button id="btnMusica" type="button">Ir para MusicFly</button>
            <button id="btnSair" type="button">Sair</button>
        </div>
    </header>

    <main class="admin-container">
        <section class="admin-intro">
            <h2>Gerenciar músicas</h2>
            <p>Cadastre, edite e exclua músicas do MusicFly.</p>
            <p class="admin-permissao">
                Somente administradores podem gerenciar músicas.
            </p>
        </section>

        <section class="admin-card">
            <h3 id="tituloFormulario">Cadastrar música</h3>

            <form id="formMusica">
                <div class="campo-admin">
                    <label for="titulo">Título da música</label>
                    <input id="titulo" name="titulo" type="text"
                        placeholder="Título da música" required>
                </div>

                <div class="campo-admin">
                    <label for="artista">Artista</label>
                    <input id="artista" name="artista" type="text"
                        placeholder="Nome do artista" required>
                </div>

                <div class="campo-admin">
                    <label for="capaUrl">URL da capa</label>
                    <input id="capaUrl" name="capaUrl" type="url"
                        placeholder="https://site.com/capa.jpg">
                    <small>Opcional. Use um link direto para uma imagem.</small>
                </div>

                <div class="campo-admin">
                    <label for="audioUrl">URL do áudio</label>
                    <input id="audioUrl" name="audioUrl" type="url"
                        placeholder="https://site.com/musica.mp3" required>
                    <small>O endereço deve permitir a reprodução do áudio.</small>
                </div>

                <div class="admin-form-buttons">
                    <button id="btnSalvar" type="submit">Cadastrar música</button>
                    <button id="btnCancelar" type="button" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section class="admin-card lista-card">
            <div class="lista-titulo">
                <h3>Músicas cadastradas</h3>
                <p>Edite os dados ou remova uma música.</p>
            </div>

            <div id="listaMusicas" class="lista-musicas-admin"></div>
        </section>
    </main>

    <script type="module" src="./js/admin.js"></script>
    <script src="./js/pwa.js"></script>
</body>
</html>
